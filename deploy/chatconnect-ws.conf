; ============================================================
; Supervisor config for ChatConnect WebSocket server
; ============================================================
; Place this file at: /etc/supervisor/conf.d/chatconnect-ws.conf
; Then run:
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start chatconnect-ws
; ============================================================

[program:chatconnect-ws]
command=php /var/www/html/Chat-app/websocket/server.php
directory=/var/www/html/Chat-app
autostart=true
autorestart=true
startretries=5
stderr_logfile=/var/log/supervisor/chatconnect-ws.err.log
stdout_logfile=/var/log/supervisor/chatconnect-ws.out.log
user=www-data
environment=WS_PORT="8080"
