# ============================================================
# Nginx config for ChatConnect
# ============================================================
# Add this inside your existing server {} block, or use as a
# new virtual host. Replace "yourdomain.com" and document root.
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # Redirect HTTP → HTTPS (recommended for wss://)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    root /var/www/html/Chat-app;
    index public/index.html public/dashboard.php;

    # SSL – update paths to your certificates
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # ── WebSocket proxy ────────────────────────────────────
    # Clients connect to wss://yourdomain.com/ws
    # Ratchet listens on 127.0.0.1:8080
    location /ws {
        proxy_pass          http://127.0.0.1:8080;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "Upgrade";
        proxy_set_header    Host       $host;
        proxy_set_header    X-Real-IP  $remote_addr;
        proxy_read_timeout  3600;   # keep WS connections alive
    }

    # ── PHP files ──────────────────────────────────────────
    location ~ \.php$ {
        include        fastcgi_params;
        fastcgi_pass   unix:/run/php/php8.2-fpm.sock;  # adjust PHP version
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # ── Static assets ──────────────────────────────────────
    location /storage/avatars/ {
        alias /var/www/html/Chat-app/storage/avatars/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /public/index.html;
    }

    # Block .git and sensitive dirs
    location ~ /\.(git|env) { deny all; }
}
